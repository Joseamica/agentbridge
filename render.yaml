services:
  - type: web
    name: agentbridge-relay
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start -w @agentbridge/relay
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: agentbridge-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: agentbridge-db
    databaseName: agentbridge
