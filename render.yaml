services:
  - type: web
    name: agentbridge-relay
    runtime: node
    plan: starter
    # One instance on purpose. On boot the relay closes every open attempt and requeues its
    # ticket, which is how it recovers from a crash. With two instances overlapping during a
    # deploy, the new one would requeue questions the old one is still answering.
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm run start -w @agentbridge/relay
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: agentbridge-db
          property: connectionString
      # Render generates this once and shows it in the dashboard. It mints enrollment links,
      # so it is the master credential: copy it into a password manager, never into a chat.
      - key: ADMIN_TOKEN
        generateValue: true
      # PUBLIC_URL is intentionally absent: the relay falls back to RENDER_EXTERNAL_URL, which
      # Render sets to this service's own address. Set it explicitly only behind a custom domain.

databases:
  - name: agentbridge-db
    databaseName: agentbridge
    # Pinned: the schema and the whole test suite run against Postgres 16.
    postgresMajorVersion: "16"
    # No external connections. Only the relay, over Render's internal network, reaches the data —
    # and that data is the plaintext of every question and answer for 7 days.
    ipAllowList: []
